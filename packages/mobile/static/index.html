<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#161a22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Enclave</title>
    <style>
      :root {
        --bg: #161a22;
        --panel: #1f2430;
        --line: #2d3442;
        --text: #e8ecf2;
        --muted: #9aa3b2;
        --accent: #6aa3ff;
        --danger: #ff7a7a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: calc(16px + env(safe-area-inset-top)) 16px 32px;
      }
      h1 {
        font-size: 22px;
        margin: 4px 0 16px;
      }
      p.note {
        color: var(--muted);
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .name {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
      }
      .state-running {
        color: #7ad58a;
      }
      .error {
        color: var(--danger);
        font-size: 14px;
        margin-top: 8px;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--line);
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        min-height: 44px;
      }
      button.primary {
        background: var(--accent);
        color: #0b1020;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
      }

      #viewer {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
      }
      #viewer.open {
        display: block;
      }
      #stage {
        position: absolute;
        inset: 0;
        bottom: calc(52px + env(safe-area-inset-bottom));
      }
      #bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(52px + env(safe-area-inset-bottom));
        padding: 4px 6px env(safe-area-inset-bottom);
        display: flex;
        gap: 4px;
        background: #0d1016;
      }
      #bar button {
        flex: 1;
        min-height: 44px;
        padding: 0;
        background: transparent;
        font-size: 15px;
      }
      #bar button.live {
        color: var(--danger);
      }
      #bar button.live::before {
        content: '';
        display: inline-block;
        width: 8px;
        height: 8px;
        margin-right: 5px;
        border-radius: 50%;
        background: var(--danger);
        vertical-align: middle;
      }
      #status {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(13, 16, 22, 0.85);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 14px;
        color: var(--muted);
        display: none;
      }
      #status.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <main id="home"></main>
    <div id="viewer">
      <div id="stage"></div>
      <div id="status"></div>
      <div id="bar">
        <button id="back" aria-label="Back">Back</button>
        <button id="forward" aria-label="Forward">Forward</button>
        <button id="reload" aria-label="Reload">Reload</button>
        <button id="keyboard" aria-label="Keyboard">Keyboard</button>
        <button id="mic" aria-label="Share the phone microphone" aria-pressed="false">Mic</button>
        <button id="close" aria-label="Close">Close</button>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
