<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#161a22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon-192.png" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Enclave</title>
    <style>
      :root {
        --bg: #161a22;
        --panel: #1f2430;
        --line: #2d3442;
        --text: #e8ecf2;
        --muted: #9aa3b2;
        --accent: #6aa3ff;
        --danger: #ff7a7a;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.4 system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
      }
      body {
        -webkit-tap-highlight-color: transparent;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: calc(16px + env(safe-area-inset-top)) 16px 32px;
      }
      h1 {
        font-size: 22px;
        margin: 4px 0 16px;
      }
      p.note {
        color: var(--muted);
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        margin-bottom: 12px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .name {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        color: var(--muted);
        font-size: 14px;
      }
      .state-running {
        color: #7ad58a;
      }
      .error {
        color: var(--danger);
        font-size: 14px;
        margin-top: 8px;
      }
      button {
        font: inherit;
        color: var(--text);
        background: var(--line);
        border: 0;
        border-radius: 10px;
        padding: 10px 14px;
        min-height: 44px;
      }
      button.primary {
        background: var(--accent);
        color: #0b1020;
        font-weight: 600;
      }
      button:disabled {
        opacity: 0.5;
      }

      #viewer {
        position: fixed;
        inset: 0;
        background: #000;
        display: none;
      }
      #viewer.open {
        display: block;
      }
      #stage {
        position: absolute;
        inset: 0;
        bottom: calc(52px + env(safe-area-inset-bottom));
      }
      #bar {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: calc(52px + env(safe-area-inset-bottom));
        padding: 4px 2px env(safe-area-inset-bottom);
        display: flex;
        background: #0d1016;
      }
      #bar button {
        position: relative;
        flex: 1;
        min-width: 0;
        min-height: 44px;
        padding: 0;
        background: transparent;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #bar svg {
        width: 24px;
        height: 24px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #bar button.live {
        color: var(--danger);
      }
      #bar button.live::after {
        content: '';
        position: absolute;
        top: 6px;
        left: calc(50% + 9px);
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--danger);
      }
      #live {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top));
        left: 10px;
        right: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 4px 4px 12px;
        border-radius: 12px;
        background: rgba(13, 16, 22, 0.88);
        box-shadow: 0 0 0 1px var(--danger);
        font-size: 14px;
      }
      #live[hidden] {
        display: none;
      }
      #live:not([hidden]) ~ #preview {
        top: calc(62px + env(safe-area-inset-top));
      }
      #live-text {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #live-stop {
        flex: none;
        min-height: 36px;
        padding: 0 10px;
        font-size: 14px;
      }
      #preview {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top));
        right: 10px;
        width: 128px;
        border-radius: 10px;
        overflow: hidden;
        background: #000;
        box-shadow: 0 0 0 2px var(--danger);
      }
      #preview[hidden] {
        display: none;
      }
      #preview video {
        display: block;
        width: 100%;
        aspect-ratio: 16 / 9;
        object-fit: cover;
      }
      #flip {
        position: absolute;
        right: 4px;
        bottom: 4px;
        min-height: 32px;
        padding: 0 10px;
        font-size: 13px;
        background: rgba(13, 16, 22, 0.8);
      }
      #ask {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: calc(62px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 10px 10px 10px 14px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
      }
      #ask[hidden] {
        display: none;
      }
      #copied {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: calc(62px + env(safe-area-inset-bottom));
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 6px 6px 14px;
        border-radius: 12px;
        background: var(--panel);
        border: 1px solid var(--line);
        font-size: 15px;
      }
      #copied[hidden] {
        display: none;
      }
      #ask:not([hidden]) ~ #copied {
        bottom: calc(132px + env(safe-area-inset-bottom));
      }
      #copied span {
        flex: 1;
      }
      #ask-text {
        flex: 1;
        font-size: 15px;
      }
      #status {
        position: absolute;
        top: calc(10px + env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(13, 16, 22, 0.85);
        padding: 6px 12px;
        border-radius: 999px;
        font-size: 14px;
        color: var(--muted);
        display: none;
      }
      #status.show {
        display: block;
      }
    </style>
  </head>
  <body>
    <main id="home"></main>
    <div id="viewer">
      <div id="stage"></div>
      <div id="status"></div>
      <div id="live" role="status" hidden>
        <span id="live-text"></span>
        <button id="live-stop">Stop sharing</button>
      </div>
      <div id="preview" hidden>
        <video id="preview-video" muted playsinline autoplay></video>
        <button id="flip" aria-label="Switch between the front and back camera">Flip</button>
      </div>
      <div id="ask" role="alertdialog" aria-labelledby="ask-text" hidden>
        <div id="ask-text"></div>
        <button id="ask-later">Not now</button>
        <button id="ask-share" class="primary">Share</button>
      </div>
      <input id="file-input" type="file" hidden />
      <div id="copied" role="status" hidden>
        <span>Copied in the profile.</span>
        <button id="copy-phone">Copy to phone</button>
      </div>
      <div id="bar">
        <button id="back" aria-label="Back">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" /></svg>
        </button>
        <button id="forward" aria-label="Forward">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6" /></svg>
        </button>
        <button id="reload" aria-label="Reload">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66L20 8.5" />
            <path d="M20 3.5v5h-5" />
          </svg>
        </button>
        <button id="keyboard" aria-label="Keyboard">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="6" width="19" height="12" rx="2" />
            <path d="M6.5 10h.01M10 10h.01M14 10h.01M17.5 10h.01M8 14h8" />
          </svg>
        </button>
        <button id="paste" aria-label="Paste the phone's clipboard into the profile">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="8" y="2.5" width="8" height="4" rx="1" />
            <path
              d="M16 4.5h2a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2h2"
            />
          </svg>
        </button>
        <button id="mic" aria-label="Share the phone microphone" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="2.5" width="6" height="11.5" rx="3" />
            <path d="M5.5 10.5v.5a6.5 6.5 0 0 0 13 0v-.5M12 17.5v4" />
          </svg>
        </button>
        <button id="camera" aria-label="Share the phone camera" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="2.5" y="6" width="13.5" height="12" rx="2" />
            <path d="M16 10.5l5.5-3.5v10l-5.5-3.5" />
          </svg>
        </button>
        <button id="close" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12" /></svg>
        </button>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
