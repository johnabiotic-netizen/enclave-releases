# coturn for Enclave (docs/setup/relay-deploy.md). The secret, realm and public IP come from
# the command line in compose.yaml (from .env), so this file holds no secrets.

listening-port=3478
# Relay ports handed to clients (open these UDP ports in the firewall).
min-port=49160
max-port=49999

# Time-limited passwords made by the relay from the shared secret (use-auth-secret).
use-auth-secret
fingerprint
stale-nonce=600

# No TURN over TLS for now: plain TURN over UDP and TCP 3478. Media is encrypted end to end
# (DTLS-SRTP) either way.
no-tls

# Never relay into private or local networks (the server's own or anyone else's).
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=224.0.0.0-255.255.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Limits per user (one phone or one PC) and in total.
user-quota=12
total-quota=200

no-software-attribute
log-file=stdout
pidfile=/var/tmp/turnserver.pid
simple-log
