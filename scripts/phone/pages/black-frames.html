<!doctype html>
<meta charset="utf-8">
<title>tear test</title>
<video id="v" autoplay muted playsinline width="320"></video>
<pre id="out">running</pre>
<script>
// Test-only (black-frames.sh): for 40 s, look at every camera frame the page gets, count black ones.
const out = document.getElementById('out');
(async () => {
  const r = { started: new Date().toISOString() };
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
    const v = document.getElementById('v');
    v.srcObject = s;
    await v.play().catch(() => {});
    const c = document.createElement('canvas');
    c.width = 64; c.height = 36;
    const g = c.getContext('2d', { willReadFrequently: true });
    let frames = 0, black = 0, maxRun = 0, run = 0;
    const means = {};
    const end = performance.now() + 40000;
    await new Promise((done) => {
      const tick = () => {
        g.drawImage(v, 0, 0, 64, 36);
        const px = g.getImageData(0, 0, 64, 36).data;
        let sum = 0;
        for (let j = 0; j < px.length; j += 4) sum += px[j + 1];
        const mean = sum / (px.length / 4);
        frames++;
        means[Math.round(mean / 10) * 10] = (means[Math.round(mean / 10) * 10] || 0) + 1;
        if (mean < 30) { black++; run++; maxRun = Math.max(maxRun, run); } else run = 0;
        if (performance.now() < end) v.requestVideoFrameCallback(tick); else done();
      };
      v.requestVideoFrameCallback(tick);
    });
    Object.assign(r, { frames, black, maxRun, means, settings: s.getVideoTracks()[0].getSettings() });
  } catch (e) { r.error = String(e); }
  out.textContent = JSON.stringify(r, null, 1);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(r, null, 1)], { type: 'application/json' }));
  a.download = 'black-frames-result.json';
  document.body.appendChild(a);
  a.click();
})();
</script>
