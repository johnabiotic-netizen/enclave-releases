
[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /run/session/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:proxy]
environment=HOME="/tmp"
command=/usr/local/bin/gost -C /run/session/gost.yaml
autorestart=true
priority=200
user=egress
stdout_logfile=/var/log/neko/proxy.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:camoufox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/opt/session/session.sh
stopsignal=INT
stopwaitsecs=10
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/camoufox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

[program:media]
command=/opt/session/media_bridge.py
autorestart=true
priority=150
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/media_bridge.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
