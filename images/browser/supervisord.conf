; Enclave programs, included by neko's /etc/neko/supervisord.conf next to x-server, pulseaudio and neko.

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /run/enclave/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/openbox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

; Local, unauthenticated SOCKS5 on 127.0.0.1:1080 that forwards to the profile's real
; proxy with its credentials. Camoufox only ever talks to this.
[program:proxy]
environment=HOME="/tmp"
command=/usr/local/bin/gost -C /run/enclave/gost.yaml
autorestart=true
priority=200
user=egress
stdout_logfile=/var/log/neko/proxy.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true

[program:camoufox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/opt/enclave/start-browser.sh
stopsignal=INT
stopwaitsecs=10
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/camoufox.log
stdout_logfile_maxbytes=100MB
stdout_logfile_backups=10
redirect_stderr=true

; Stage 4: keeps the phone camera's latest frame (from neko's webcam pipe) in
; /dev/shm/enclave-camera for the browser's camera. Before neko, which writes the pipe.
[program:camfeed]
command=/opt/enclave/camfeed.py
autorestart=true
priority=150
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/camfeed.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
redirect_stderr=true
