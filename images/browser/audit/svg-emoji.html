  ].map((c) => String.fromCodePoint(...c));
  const g = document.getElementById('g');
  const rows = [];
  for (const e of EM) {
    const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    t.setAttribute('x', 32);
    t.setAttribute('y', 32);
    t.setAttribute(
      'style',
      "font-family:'Segoe Fluent Icons', 'Ink Free', 'Bahnschrift', 'Segoe MDL2 Assets', 'HoloLens MDL2 Assets', 'Leelawadee UI', 'Javanese Text', 'Segoe UI Emoji', 'Aldhabi', 'Gadugi', 'Myanmar Text', 'Nirmala UI', 'Lucida Console', 'Cambria Math', 'Bai Jamjuree', 'Chakra Petch', 'Charmonman', 'Fahkwang', 'K2D', 'Kodchasan', 'KoHo', 'Sarabun', 'Srisakdi', 'Galvji', 'MuktaMahee Regular', 'InaiMathi Bold', 'American Typewriter Semibold', 'Futura Bold', 'SignPainter-HouseScript Semibold', 'PingFang HK Light', 'Kohinoor Devanagari Medium', 'Luminari', 'Geneva', 'Helvetica Neue', 'Droid Sans Mono', 'Dancing Script', 'Roboto', 'Ubuntu', 'Liberation Mono', 'Source Code Pro', 'DejaVu Sans', 'OpenSymbol', 'Chilanka', 'Cousine', 'Arimo', 'Jomolhari', 'MONO', 'Noto Color Emoji', sans-serif !important;font-size:200px;transform:scale(1.000999)",

    t.textContent = e;
    g.appendChild(t);
  }
  const els = [...g.children];
  els.forEach((t, i) => {
    const b = t.getBBox();
    rows.push([
      EM[i].codePointAt(0).toString(16),
      +b.x.toFixed(2),
      +b.y.toFixed(2),
      +b.width.toFixed(2),
      +b.height.toFixed(2),
      +t.getComputedTextLength().toFixed(3),
    ]);
  });
  const gb = g.getBBox();
  const sum = Math.abs(gb.x) + Math.abs(gb.y) + gb.width + gb.height;
  const text = JSON.stringify({ groupSum: sum, group: [gb.x, gb.y, gb.width, gb.height], rows });
  document.getElementById('out').textContent = text;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
  a.download = 'enclave-baseline.json';
  a.click();
